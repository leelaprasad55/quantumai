services:
  - type: web
    name: quantumlearn
    runtime: docker
    dockerfilePath: ./quantum_backend/Dockerfile
    dockerContext: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: IBM_QUANTUM_API_KEY
        sync: false
      - key: IBM_QUANTUM_INSTANCE
        sync: false
      - key: QBRAID_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://quantumlearn.onrender.com
